steps:
  # Dockerイメージのビルド
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rag-prepare', '-f', 'services/rag-prepare/Dockerfile', '.']

  # イメージのプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rag-prepare']

  # Cloud Runへのデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'rag-prepare'
      - '--image'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rag-prepare'
      - '--region'
      - 'asia-northeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--timeout=600'
      - '--service-account=document-management-system@$PROJECT_ID.iam.gserviceaccount.com'
      - '--update-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,PIPELINE_LAB_BASE=${_PIPELINE_LAB_BASE},RAG_PREPARE_BATCH_AUDIENCE=https://rag-prepare-6txyszr6ra-an.a.run.app,RAG_PREPARE_BATCH_INVOKER_EMAIL=document-management-system@$PROJECT_ID.iam.gserviceaccount.com'
      - '--remove-env-vars=GOOGLE_AI_API_KEY,OPENAI_API_KEY,SUPABASE_URL,SUPABASE_KEY,SUPABASE_SERVICE_ROLE_KEY,FAST_INDEX_PDF_TOOLBOX_BASE,RAG_PREPARE_PDF_TOOLBOX_BASE'
      - '--set-secrets'
      - 'GOOGLE_AI_API_KEY=GOOGLE_AI_API_KEY:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_KEY=SUPABASE_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,GOOGLE_AI_PAID_API_KEY=GOOGLE_AI_PAID_API_KEY:latest'

images:
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/rag-prepare'

substitutions:
  _PIPELINE_LAB_BASE: 'https://pipeline-lab-6txyszr6ra-an.a.run.app'

# 明示 build service account 利用時の (c)。main に無いと Cloud Build が毎回失敗する。
options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE
