version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nas-sync-postgres
    environment:
      POSTGRES_USER: sync_user
      POSTGRES_PASSWORD: sync_secure_password_2026
      POSTGRES_DB: sync_metadata
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      # 初期化SQLをコンテナ起動時に自動実行するためのマウント
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5433:5432"

    restart: always

  api-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nas-sync-api
    ports:
      - "8080:8080"
    volumes:
      - ./storage:/data/storage
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=sync_user
      - DB_PASSWORD=sync_secure_password_2026
      - DB_NAME=sync_metadata
      - STORAGE_PATH=/data/storage
    depends_on:
      - postgres
    restart: always

