<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAS Sync Explorer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-[#F8F9FA] text-[#1F2937] min-h-screen flex flex-col font-sans">
    
    <!-- Top Accent Line -->
    <div class="h-1.5 w-full bg-[#2563EB] shrink-0"></div>

    <!-- Header -->
    <header class="bg-white border-b border-[#E5E7EB] py-4 px-6 shadow-sm flex items-center justify-between shrink-0">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center text-[#2563EB]">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">NAS Sync Explorer</h1>
          <p class="text-xs text-gray-400">DS220+ Private Cloud Storage</p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex space-x-1 bg-gray-100 p-1 rounded-lg text-sm">
        <button id="tab-explorer" class="px-4 py-1.5 font-semibold rounded-md bg-white shadow-sm text-gray-800">
          📁 ファイル
        </button>
        <button id="tab-activities" class="px-4 py-1.5 font-semibold rounded-md text-gray-500 hover:text-gray-800">
          📈 履歴
        </button>
      </nav>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex overflow-hidden">
      
      <!-- PAGE 1: Explorer View (default) -->
      <div id="page-explorer" class="flex-1 flex overflow-hidden">
        
        <!-- Left Pane: Folder Tree -->
        <aside class="w-72 bg-white border-r border-[#E5E7EB] flex flex-col shrink-0 overflow-y-auto">
          <div class="p-4 border-b border-[#E5E7EB] bg-gray-50">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">同期フォルダツリー</h2>
          </div>
          <div class="p-4 flex-1">
            <ul id="folder-tree-root" class="space-y-1">
              <!-- Folder tree injected here -->
              <li class="text-sm text-gray-400 italic">ロード中...</li>
            </ul>
          </div>
        </aside>

        <!-- Right Pane: File Table -->
        <section class="flex-1 flex flex-col min-w-0 bg-white">
          <!-- Breadcrumb -->
          <div class="py-3 px-6 border-b border-[#E5E7EB] bg-gray-50 flex items-center justify-between shrink-0">
            <div id="breadcrumb" class="text-sm font-semibold text-gray-600 truncate">
              選択されたフォルダ: なし
            </div>
            <!-- Simple action for uploading testing files directly via web -->
            <div class="flex items-center space-x-2">
              <label for="web-upload-file" id="web-upload-label" class="hidden text-xs font-semibold px-3 py-1.5 bg-[#2563EB] hover:bg-blue-700 text-white rounded cursor-pointer transition-colors shadow-sm">
                📤 選択フォルダにアップロード
              </label>
              <input type="file" id="web-upload-file" class="hidden" />
            </div>
          </div>

          <!-- File Grid Table -->
          <div class="flex-1 overflow-auto">
            <table class="w-full text-left border-collapse">
              <thead class="bg-gray-50 border-b border-[#E5E7EB] sticky top-0 text-xs font-bold text-gray-400 uppercase tracking-wider shrink-0 z-10">
                <tr>
                  <th class="py-3.5 px-6">ファイル名</th>
                  <th class="py-3.5 px-4 w-28">サイズ</th>
                  <th class="py-3.5 px-4 w-44">最終同期日時</th>
                  <th class="py-3.5 px-4 w-40">アップロード元</th>
                  <th class="py-3.5 px-6 w-36 text-right">操作</th>
                </tr>
              </thead>
              <tbody id="files-tbody" class="text-sm divide-y divide-gray-100">
                <tr>
                  <td colspan="5" class="py-12 text-center text-gray-400 italic">
                    左側のツリーからフォルダを選択してください。
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

      </div>

      <!-- PAGE 2: Activities View (hidden by default) -->
      <div id="page-activities" class="flex-1 overflow-auto p-6 hidden">
        <div class="max-w-4xl mx-auto space-y-4">
          <div class="flex justify-between items-center border-b border-[#E5E7EB] pb-3">
            <h2 class="text-xl font-bold">アクティビティ履歴</h2>
            <button id="refresh-activities" class="text-xs font-semibold border border-[#E5E7EB] bg-white hover:bg-gray-50 text-gray-700 px-3 py-1.5 rounded transition-colors shadow-sm">
              🔄 履歴を更新
            </button>
          </div>

          <div class="bg-white border border-[#E5E7EB] rounded-lg shadow-sm overflow-hidden">
            <table class="w-full text-left border-collapse">
              <thead class="bg-gray-50 border-b border-[#E5E7EB] text-xs font-bold text-gray-400 uppercase tracking-wider">
                <tr>
                  <th class="py-3.5 px-6 w-44">日時</th>
                  <th class="py-3.5 px-4 w-32">端末</th>
                  <th class="py-3.5 px-4 w-28">アクション</th>
                  <th class="py-3.5 px-6">ファイルパス</th>
                </tr>
              </thead>
              <tbody id="activities-tbody" class="text-sm divide-y divide-gray-100">
                <tr>
                  <td colspan="4" class="py-8 text-center text-gray-400 italic">
                    履歴データを読み込み中...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
