<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Flattener - フォルダ構造のフラット化ツール</title>
    <meta name="description" content="複数階層のサブフォルダ内にあるすべてのファイルを安全に最上位フォルダへ移動し、重複ファイルには自動で連番を付与してフラット化するローカル専用Webアプリです。">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-decor">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-folder-tree logo-icon"></i>
                <span class="logo-text">File Flattener</span>
            </div>
            <p class="tagline">サブフォルダ内の全ファイルを最上位フォルダへ瞬時に集約します</p>
        </header>

        <main class="main-content">
            <!-- 設定カード -->
            <section class="card config-card">
                <h2 class="card-title"><i class="fa-solid fa-sliders"></i> 設定とフォルダ指定</h2>
                
                <div class="form-group">
                    <label for="folder-path-input" class="form-label">対象のローカルフォルダパス</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-folder-open input-icon"></i>
                        <input type="text" id="folder-path-input" class="form-input" placeholder="例: C:\Users\Username\Documents\target_folder" autocomplete="off" required>
                    </div>
                    <small class="form-tip">※ローカルで起動しているFlaskプロセスが直接ファイルを操作します。有効な絶対パスを入力してください。</small>
                </div>

                <div class="options-group">
                    <div class="checkbox-wrapper">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="clean-dirs-checkbox" checked>
                            <span class="checkbox-box"></span>
                            <span class="checkbox-label">ファイル移動後に空になったサブフォルダを削除する</span>
                        </label>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" id="scan-btn" class="btn btn-secondary">
                        <i class="fa-solid fa-magnifying-glass"></i> スキャンする (Dry Run)
                    </button>
                    <button type="button" id="execute-btn" class="btn btn-primary" disabled>
                        <i class="fa-solid fa-bolt"></i> フラット化を実行する
                    </button>
                </div>
            </section>

            <!-- ステータス・メッセージ -->
            <div id="status-message" class="status-message hidden">
                <i class="status-icon"></i>
                <span class="status-text"></span>
            </div>

            <!-- スキャン結果・プレビューエリア -->
            <section id="preview-section" class="card preview-card hidden">
                <div class="preview-header">
                    <h2 class="card-title"><i class="fa-solid fa-list-check"></i> 移動プレビュー (<span id="file-count">0</span>件のファイル)</h2>
                    <div class="badge info-badge"><i class="fa-solid fa-info-circle"></i> 同名ファイルは自動で連番が付与されます</div>
                </div>
                
                <div class="table-container">
                    <table class="preview-table">
                        <thead>
                            <tr>
                                <th>元の相対パス (移動元)</th>
                                <th><i class="fa-solid fa-arrow-right-long"></i></th>
                                <th>最上位でのファイル名 (移動先)</th>
                            </tr>
                        </thead>
                        <tbody id="preview-tbody">
                            <!-- JSで動的に追加 -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- ログ表示エリア -->
            <section id="log-section" class="card log-card hidden">
                <h2 class="card-title"><i class="fa-solid fa-terminal"></i> 実行ログ</h2>
                <div id="log-output" class="log-output">
                    <!-- JSで実行結果を出力 -->
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>&copy; 2026 Antigravity File Flattener. Powered by Flask & Google DeepMind Pair Programming.</p>
        </footer>
    </div>

    <!-- Custom JavaScript -->
    <script src="/static/main.js"></script>
</body>
</html>
